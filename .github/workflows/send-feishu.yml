name: 飞书 AI 日报

on:
  schedule:
    # 07:57 Beijing time. Starting away from the top of the UTC hour avoids
    # GitHub Actions' busiest scheduling window; delivery normally lands near 08:00.
    - cron: '57 23 * * *'
  push:
    paths:
      - '.github/workflows/send-feishu.yml'
      - 'scripts/send-feishu-digest.js'
  workflow_dispatch:

jobs:
  send-to-feishu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      models: read

    steps:
      - name: 读取仓库
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 筛选高价值内容并发送到飞书
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK || secrets.FEISHU_WEBHOOK_URL || secrets.FEISHU_BOT_WEBHOOK }}
          FEISHU_SIGNING_SECRET: ${{ secrets.FEISHU_SIGNING_SECRET }}
        run: node scripts/send-feishu-digest.js
